  <text x="66" y="308" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#626c60">Try your furniture. Find your fit.</text>
  <text x="66" y="337" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#626c60">A free 2D + 3D planner, in your browser.</text>
