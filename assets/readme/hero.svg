<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Room Layout Planner — Make room for what matters</title>
  <desc id="desc">A warm cream banner with a terracotta room icon and an original floor-plan illustration. A free, local-first 2D and 3D furniture layout planner.</desc>
