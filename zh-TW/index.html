<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="搬家前先試擺家具。免費、優先在本地處理的 2D / 3D 房間配置工具，免帳號、不上傳、不靠 AI 猜尺寸。" data-i18n-content="ui.plan_your_furniture_layout_before_you_move_a">
  <meta name="theme-color" content="#f8f7f3">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
  <title data-i18n="ui.room_layout_planner_make_room_for_what_matters">Room Layout Planner — 為重要的事留點空間</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../src/styles.css">
  <script type="module" src="../src/app.js"></script>
  <!-- Locale links -->
  <link rel="alternate" hreflang="en" href="../">
  <link rel="alternate" hreflang="zh-TW" href="../zh-TW/">
  <link rel="alternate" hreflang="ja" href="../ja/">
  <link rel="alternate" hreflang="de" href="../de/">
  <link rel="alternate" hreflang="fr" href="../fr/">
  <link rel="alternate" hreflang="es" href="../es/">
  <link rel="alternate" hreflang="x-default" href="../">
  <!-- End locale links -->
</head>
<body>
  <a class="skip-link" href="#plan-canvas" data-i18n="ui.skip_to_layout">跳至方案</a>
  <header class="app-header">
    <a class="brand" href="../" aria-label="Room Layout Planner 首頁" data-i18n-aria-label="ui.room_layout_planner_home"><span class="brand-mark" aria-hidden="true">⌑</span><span>room<span class="brand-light"> / </span>plan<small data-i18n="ui.make_room_for_what_matters">為重要的事留點空間</small></span></a>
    <div class="header-status"><span class="status-dot"></span><span id="save-status" role="status" aria-live="polite" data-i18n="ui.stored_on_your_device">儲存於你的裝置</span></div>
    <div id="language-control" class="language-control"></div><div class="header-actions"><button id="new-project" data-i18n="ui.new">新建</button><button id="import-project" data-i18n="ui.open_json">開啟 JSON</button><button id="export-project" class="primary"><span data-i18n="ui.export">匯出</span><span aria-hidden="true">↗</span></button><button id="help" class="icon-button" aria-label="幫助與隱私" data-i18n-aria-label="ui.help_and_privacy">?</button></div>
  </header>
  <main class="app-layout">
    <aside id="library-panel" class="panel library-panel" aria-label="建立房間與家具庫" data-i18n-aria-label="ui.build_and_furniture_library">
      <div class="panel-mobile-head"><strong data-i18n="ui.build_your_room">佈置你的房間</strong><button data-close-panel class="icon-button" aria-label="關閉家具庫" data-i18n-aria-label="ui.close_library">×</button></div>
      <div class="panel-intro"><span class="eyebrow" data-i18n="ui.your_space_to_scale">按實際尺寸規劃你的空間</span><h1><span data-i18n="ui.a_better_fit">擺得合適，</span><br><span data-i18n="ui.starts_here">從這裡開始。</span></h1><p><span data-i18n="ui.use_real_dimensions">用真實尺寸，</span><br><span data-i18n="ui.find_a_layout_that_works">找到合適的配置。</span></p></div>
      <section class="build-section"><h2 data-i18n="ui.start_with_your_room">從你的房間開始</h2><button id="rectangle-room" class="wide room-button"><span aria-hidden="true">▱</span><span data-i18n="ui.create_resize_room">建立／調整房間</span></button><button id="import-image" class="wide secondary" data-i18n="ui.import_a_floor_plan">匯入平面圖</button><p class="hint"><span data-i18n="ui.import_as_a_background_then_trace">匯入為底圖，再手動描牆。</span><br><span data-i18n="ui.no_automatic_wall_or_size_detection">不會自動識別牆或尺寸。</span></p></section>
      <section><div class="section-heading"><h2 data-i18n="ui.furniture_library">家具庫</h2><span class="muted" data-i18n="ui.6_essentials">6 種基本家具</span></div><div id="presets" class="preset-grid"></div><p class="hint"><span data-i18n="ui.presets_are_a_starting_point">預設只是起點，</span><br><span data-i18n="ui.measure_your_own_furniture">請實際測量你的家具。</span></p><button id="custom-furniture" class="wide" data-i18n="ui.custom_furniture">＋ 自訂家具</button></section>
      <section class="background-section" id="background-controls" hidden></section>
      <div class="local-note"><span aria-hidden="true">◈</span><div><strong data-i18n="ui.yours_and_only_yours">你的方案，只屬於你。</strong><p><span data-i18n="ui.your_plans_stay_in_this_browser">方案留在此瀏覽器。</span><br><span data-i18n="ui.download_json_to_keep_a_backup">下載 JSON 留存備份。</span></p></div></div>
    </aside>
    <section class="workspace" aria-label="配置工作區" data-i18n-aria-label="ui.layout_workspace">
      <div class="workspace-top"><div><span class="eyebrow" data-i18n="ui.room_layout_planner">房間配置規劃工具</span><button id="project-name" class="project-name" title="重新命名方案" data-i18n-title="ui.rename_project" data-i18n="name.untitled">未命名房間</button></div><div class="view-switch" role="group" aria-label="配置視圖" data-i18n-aria-label="ui.layout_view"><button id="view-2d" aria-pressed="true" data-i18n="ui.2d_plan">2D 平面圖</button><button id="view-3d" aria-pressed="false" data-i18n="ui.3d_view">3D 視圖</button></div></div>
      <div id="notice" class="notice" role="status" hidden></div>
      <div class="canvas-shell" id="canvas-shell">
        <canvas id="plan-canvas" tabindex="0" aria-label="可編輯的房間平面圖。從家具庫加入家具，再拖動移動；也可使用工具與數值屬性欄位。" data-i18n-aria-label="ui.editable_room_plan_use_the_library_to_add"></canvas>
        <div id="three-host" hidden></div>
        <div id="three-error" class="three-error" role="alert" hidden></div>
        <div class="tool-rail" id="tool-rail" role="toolbar" aria-label="平面圖工具" data-i18n-aria-label="ui.plan_tools">
          <button data-tool="select" aria-pressed="true" title="選取（V）" data-i18n-title="ui.select_v"><span aria-hidden="true">↖</span><small data-i18n="ui.select">選取</small></button>
          <button data-tool="wall" aria-pressed="false" title="畫牆（W）" data-i18n-title="ui.draw_wall_w"><span aria-hidden="true">⌜</span><small data-i18n="ui.wall">牆段</small></button>
          <button data-tool="measure" aria-pressed="false" title="測量（M）" data-i18n-title="ui.measure_m"><span aria-hidden="true">↔</span><small data-i18n="ui.measure">測量</small></button>
          <button data-tool="calibrate" aria-pressed="false" title="校準底圖" data-i18n-title="ui.calibrate_background"><span aria-hidden="true">⊹</span><small data-i18n="ui.calibrate">校準</small></button>
          <button data-tool="pan" aria-pressed="false" title="平移（P）" data-i18n-title="ui.pan_p"><span aria-hidden="true">✥</span><small data-i18n="ui.pan">平移</small></button>
        </div>
        <div id="three-options" class="three-options" hidden><button id="overview" aria-pressed="true" data-i18n="ui.overview">鳥瞰</button><button id="walk" aria-pressed="false" data-i18n="ui.walk_through">漫遊</button><label class="check-label"><input type="checkbox" id="cutaway" checked><span data-i18n="ui.cutaway_walls">剖切牆面</span></label></div>
        <div id="walk-controls" class="walk-controls" hidden><p data-i18n="ui.drag_to_look_no_collision_detection">拖動改變視線 · 不檢查碰撞</p><div><button data-walk="arrowleft" aria-label="向左看" data-i18n-aria-label="ui.look_left">↶</button><button data-walk="w" aria-label="向前走" data-i18n-aria-label="ui.walk_forward">↑</button><button data-walk="arrowright" aria-label="向右看" data-i18n-aria-label="ui.look_right">↷</button></div><div><button data-walk="a" aria-label="向左移動" data-i18n-aria-label="ui.step_left">←</button><button data-walk="s" aria-label="向後走" data-i18n-aria-label="ui.walk_backward">↓</button><button data-walk="d" aria-label="向右移動" data-i18n-aria-label="ui.step_right">→</button></div></div>
        <div class="canvas-bottom"><div class="history-tools"><button id="undo" class="icon-button" aria-label="撤銷" title="撤銷（Ctrl／Cmd Z）" data-i18n-aria-label="ui.undo" data-i18n-title="ui.undo_ctrl_cmd_z">↶</button><button id="redo" class="icon-button" aria-label="重做" title="重做（Ctrl／Cmd Shift Z）" data-i18n-aria-label="ui.redo" data-i18n-title="ui.redo_ctrl_cmd_shift_z">↷</button></div><div class="zoom-tools"><button id="zoom-out" class="icon-button" aria-label="縮小" data-i18n-aria-label="ui.zoom_out">−</button><button id="fit-view" title="適應視野（F）" data-i18n-title="ui.fit_view_f" data-i18n="ui.fit">適應視野</button><button id="zoom-in" class="icon-button" aria-label="放大" data-i18n-aria-label="ui.zoom_in">+</button></div></div>
      </div>
      <div class="workspace-footer"><span id="tool-hint" data-i18n="ui.select_a_piece_to_make_it_yours">選取家具，調整成你的尺寸。</span><label class="check-label"><input type="checkbox" id="snap-grid" checked><span data-i18n="ui.snap">吸附</span></label><label class="check-label"><input type="checkbox" id="show-grid" checked><span data-i18n="ui.grid">格線</span></label></div>
      <div class="planning-note"><span data-i18n="ui.planning_only_verify_on_site">僅供規劃 · 請現場核實</span><span data-i18n="ui.check_doors_routes_and_clearances_in_person">請實地檢查門、搬運路線及通行空間。</span></div>
    </section>
    <aside id="inspector-panel" class="panel inspector-panel" aria-label="選取物件的屬性" data-i18n-aria-label="ui.selected_object_properties">
      <div class="panel-mobile-head"><strong data-i18n="ui.details">屬性</strong><button data-close-panel class="icon-button" aria-label="關閉屬性面板" data-i18n-aria-label="ui.close_details">×</button></div>
      <div class="inspector-heading"><span class="eyebrow" data-i18n="ui.the_details_matter">細節讓配置更合適</span><h2 id="inspector-title" data-i18n="ui.your_room">你的房間</h2></div>
      <div id="inspector"></div>
      <section class="objects-section"><div class="section-heading"><h2 data-i18n="ui.in_this_plan">此方案中的物件</h2><span id="object-count" class="count-badge">0</span></div><div id="object-list"></div></section>
      <section class="project-settings"><h2 data-i18n="ui.project_settings">方案設定</h2><label for="units" data-i18n="ui.display_units">顯示單位</label><select id="units"><option value="metric" data-i18n="ui.metric_metres_286">公制（公尺）</option><option value="imperial" data-i18n="ui.imperial_feet_inches_287">英制（英尺＋英寸）</option></select><button id="wall-settings" class="wide" data-i18n="ui.wall_height_thickness">牆高與牆厚</button><button id="clear-project" class="wide danger-text" data-i18n="ui.clear_project_saved_copy">清空方案及瀏覽器備份</button></section>
    </aside>
  </main>
  <nav class="mobile-nav" aria-label="手機面板" data-i18n-aria-label="ui.mobile_panels"><button data-panel="library" data-i18n="ui.library">家具庫</button><button data-panel="tools" data-i18n="ui.tools">工具</button><button data-panel="inspector" data-i18n="ui.details">屬性</button></nav>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <input id="image-file" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg" hidden>
  <input id="project-file" type="file" accept="application/json,.json" hidden>
  <noscript><div class="no-script" data-i18n="ui.javascript_is_required_to_edit_layouts_no_account">編輯配置需要 JavaScript。下載應用程式與本地依賴後，不需要帳號或網際網路連線。</div></noscript>
</body>
</html>
